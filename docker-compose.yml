services:
  # --------------------------------------
  # PostgreSQL
  # --------------------------------------
  elishama-db:
    image: postgres:15
    environment:
      POSTGRES_DB: elishama_db
      POSTGRES_USER: elishama_user
      POSTGRES_PASSWORD: elishama_pass
    ports:
      - "5432:5432"
    volumes:
      - D:/docker/francky-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elishama_user -d elishama_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------
  # Backend Node.js / Express
  # --------------------------------------
  backend:
    build: ./back-end
    env_file: ./back-end/.env
    depends_on:
      elishama-db:
        condition: service_healthy
    ports:
      - "4000:4000"
    # Do not bind-mount the host project into the container here; it
    # would overwrite the application files that were built into the image
    # (including node_modules). The container image contains the app.
    command: sh -c "npx prisma migrate deploy || true && node src/index.js"

  # --------------------------------------
  # Frontend React / Vite
  # --------------------------------------
  frontend:
    build: ./front-end
    # Serve the frontend image built in the Dockerfile. Avoid bind-mounting
    # the host folder to prevent overwriting installed dependencies.
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
